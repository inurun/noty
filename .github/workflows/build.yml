name: Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['site/**', 'appcast.xml', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test editor and appearance
        run: ./scripts/test-editor.sh

      - name: Build
        run: ./build.sh release

      - name: Verify the bundle
        run: |
          test -x build/Noty.app/Contents/MacOS/Noty
          codesign --verify --deep --strict build/Noty.app
          lipo build/Noty.app/Contents/MacOS/Noty -verify_arch arm64 x86_64
          if otool -L build/Noty.app/Contents/MacOS/Noty | grep -q Sparkle; then exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Noty-app
          path: build/Noty.app
