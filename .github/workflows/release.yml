name: Release personal fork

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-personal-fork
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'inurun/noty'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Test editor and appearance
        run: ./scripts/test-editor.sh

      - name: Build universal archive and cask
        run: ./scripts/package-release.sh

      - name: Stage release, update tap, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(cat build/release-version)"
          TAG="local-v$VERSION"
          ARCHIVE="build/releases/$VERSION/Noty-local-$VERSION-universal.zip"
          # Upload first. A failed push leaves only a draft, so the public cask
          # never points at an archive that failed to upload.
          gh release create "$TAG" "$ARCHIVE" --draft \
            --target "$(git rev-parse HEAD)" \
            --title "Noty personal fork $VERSION" \
            --notes-file RELEASE-NOTES.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/noty-local.rb
          git commit -m "Update personal Homebrew cask to $VERSION"
          # A concurrent main update stops publication; do not overwrite it.
          git push origin HEAD:main
          gh release edit "$TAG" --draft=false --latest
